<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cozinha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Companion page for the kitchen panel: the same shopping list and mural, on the phone. */
:root{
  --bg:#060708;--card:#101416;--card2:#171c1f;--line:#232b2e;--fg:#eef0ea;--mute:#8d9591;--dim:#596160;
  --mint:#7fe0b0;--mint-ink:#06301f;--alert:#ff6f5e;--paper-ink:#1d1a12;
  --display:'Big Shoulders Display','Arial Narrow',sans-serif;--body:'Onest',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 110px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:300 54px/0.9 var(--display);margin:0;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding-bottom:6px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s}
.dot.ok{background:var(--mint)}.dot.off{background:var(--alert)}
.add{display:flex;gap:10px;margin-bottom:6px}
.add input{flex:1;min-width:0;background:var(--card2);border:1.5px solid transparent;border-radius:18px;padding:15px 16px;outline:none;transition:border-color .2s}
.add input:focus{border-color:var(--mint)}
.add input.err{border-color:var(--alert)}
.add button{width:54px;flex-shrink:0;border:0;border-radius:18px;background:var(--mint);color:var(--mint-ink);font-size:28px;line-height:1;cursor:pointer}
.err-text{color:var(--alert);font-size:14px;min-height:20px;margin:2px 4px 8px}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 2px 2px}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;animation:in .45s var(--ease)}
.row:last-child{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateX(-14px)}}
.ck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;flex-shrink:0;transition:background .25s,border-color .25s,transform .25s var(--ease)}
.ck svg{stroke:var(--mint-ink);stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s}
.row.done .ck{background:var(--mint);border-color:var(--mint);transform:scale(1.06)}
.row.done .ck svg{stroke-dashoffset:0}
.tx{position:relative;transition:color .25s;min-width:0}
.tx::after{content:'';position:absolute;left:0;top:54%;height:1.5px;width:0;background:var(--dim);transition:width .3s var(--ease)}
.row.done .tx{color:var(--dim)}.row.done .tx::after{width:100%}
.meta{margin-left:auto;font-size:13px;color:var(--dim);white-space:nowrap}
.card{background:var(--card);border-radius:22px;padding:6px 16px}
.ghost{width:100%;margin-top:16px;border:1px solid var(--line);background:none;border-radius:16px;padding:14px;color:var(--mute);cursor:pointer}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.note{border-radius:6px 6px 22px 6px;padding:14px;color:var(--paper-ink);min-height:120px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(var(--r));animation:in .45s var(--ease);overflow-wrap:anywhere}
.note small{opacity:.7;font-size:12px;margin-top:10px}
.label{font-size:14px;color:var(--mute);margin:22px 2px 8px}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);border-top:1px solid var(--line)}
nav .seg{max-width:560px;margin:0 auto;display:flex;gap:8px;position:relative}
nav button{flex:1;border:0;background:none;border-radius:16px;padding:13px;color:var(--dim);font-weight:500;cursor:pointer;position:relative;z-index:1;transition:color .3s}
nav button.on{color:var(--mint-ink)}
nav .pill{position:absolute;top:0;bottom:0;left:0;width:calc((100% - 16px) / 3);border-radius:16px;background:var(--mint);transition:transform .45s var(--ease)}
nav .seg.mural .pill{transform:translateX(calc(100% + 8px))}
nav .seg.recipes .pill{transform:translateX(calc(200% + 16px))}
.rcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:16px 18px;margin-bottom:10px;cursor:pointer;animation:in .45s var(--ease)}
.rcard b{display:block;font-weight:500;font-size:19px}
.rcard .txt{min-width:0;flex:1}
.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--card2)}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px;margin:0 0 14px;background:var(--card2);display:block}
.photo-field{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.photo-field img{width:96px;height:96px;border-radius:16px;object-fit:cover}
.photo-field label,.photo-field button{border:1px solid var(--line);background:none;border-radius:14px;padding:12px 14px;color:var(--fg);cursor:pointer;font-size:15px}
.photo-field input{display:none}
.rcard span{color:var(--mute);font-size:14px}
.primary{width:100%;border:0;border-radius:18px;background:var(--mint);color:var(--mint-ink);font-weight:500;padding:16px;cursor:pointer;margin-bottom:16px}
.back{border:0;background:none;color:var(--mint);padding:0;margin-bottom:12px;cursor:pointer;font-weight:500}
.rtitle{font:300 40px/1 var(--display);margin:4px 0 6px;overflow-wrap:anywhere}
.rmeta{color:var(--mute);font-size:14px;margin-bottom:18px}
.ol{margin:0;padding-left:22px}.ol li{margin:0 0 12px;line-height:1.45}
.ul{margin:0;padding:6px 0}.ul li{list-style:none;padding:9px 2px;border-bottom:1px solid var(--line)}.ul li:last-child{border:0}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--mute);margin:0 2px 6px}
.field input,.field textarea{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:13px 14px;outline:none;resize:vertical}
.field textarea{min-height:150px;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--mint)}
.field .err{border-color:var(--alert)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--dim);margin:-6px 2px 14px}
.import{margin-bottom:6px}
.status-chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:2px}
.status-chip.wait{background:#1f2a24;color:var(--mint)}
.status-chip.fail{background:#2a1714;color:var(--alert)}
.source{display:inline-block;color:var(--mint);font-size:14px;margin:-8px 0 18px;text-decoration:none}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--mint);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.cupom{background:var(--card);border-radius:22px;padding:16px;margin-top:22px;animation:in .45s var(--ease)}
.cupom .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cupom .head b{font-weight:500}
.cupom .month{color:var(--mint);font-size:15px}
.cupom input[type=file]{display:none}
.cupom .scan{display:block;width:100%;text-align:center;border-radius:16px;padding:14px;background:var(--mint);color:var(--mint-ink);font-weight:500;cursor:pointer}
.cupom .or{font-size:13px;color:var(--dim);margin:12px 2px 8px}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:15px}
.rec span{color:var(--mute)}
.rec.fail span{color:var(--alert)}
.rec button{border:0;background:none;color:var(--mint);cursor:pointer;padding:0;font-size:14px}
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scanner .frame{width:72vmin;height:72vmin;border-radius:24px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);border:3px solid var(--mint);position:relative}
.scanner .frame::after{content:'';position:absolute;left:8%;right:8%;height:2px;background:var(--alert);top:10%;animation:laser 1.4s ease-in-out infinite alternate}
@keyframes laser{to{top:90%}}
.scanner .msg{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;color:#fff;font-size:17px;line-height:1.4;text-shadow:0 1px 3px #000}
.scanner .bar{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:10px}
.scanner .bar button,.scanner .bar label{flex:1;border:0;border-radius:16px;padding:15px;font-weight:500;cursor:pointer;text-align:center;background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.scanner .bar input{display:none}
.cupom .scan{border:0;font:inherit}
.dinner{padding:16px}
.dinner .btns{display:flex;gap:10px}
.dinner .btns button{flex:1;border:1px solid var(--line);background:none;border-radius:16px;padding:14px;color:var(--fg);font:inherit;cursor:pointer;transition:background .25s,color .25s}
.dinner .btns button.yes{background:var(--mint);border-color:var(--mint);color:var(--mint-ink);font-weight:500}
.dinner .btns button.no{background:var(--card2);color:var(--mute)}
.dinner p{margin:12px 2px 0;color:var(--mute);font-size:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.photos .ph small{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
.photo-add{display:block;text-align:center;border:1px dashed var(--line);border-radius:16px;padding:14px;margin-top:10px;color:var(--mint);cursor:pointer}
.photo-add input{display:none}
.who{background:var(--card);border-radius:22px;padding:18px;margin-bottom:18px;animation:in .45s var(--ease)}
.who b{display:block;font-weight:500;font-size:19px;margin-bottom:4px}
.who p{margin:0 0 14px;color:var(--mute);font-size:14px}
.writer{font-size:13px;color:var(--dim);margin:-2px 2px 12px}
.writer button{border:0;background:none;color:var(--mint);padding:0;cursor:pointer;font-size:13px}
.danger{width:100%;border:1px solid var(--line);background:none;border-radius:16px;padding:14px;color:var(--alert);cursor:pointer;margin-top:4px}
.setup{background:var(--card);border-radius:22px;padding:22px;line-height:1.55;color:var(--mute)}
.setup b{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Lista</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Conectando…</span></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="seg" id="seg"><span class="pill"></span><button class="on" data-tab="list">Lista</button><button data-tab="mural">Mural</button><button data-tab="recipes">Receitas</button></div></nav>

<script>
// Filled in when the Supabase project is created (public values by design; access is guarded by the household code).
const SUPABASE_URL = "https://lplvdugodwrdolocorng.supabase.co";
const SUPABASE_KEY = "sb_publishable_-FkNl_OAbcthwZBqnjX3ew_jzuWqP7i";

const COLORS = [0xFFF3D77E, 0xFFA9D9F2, 0xFFF2B8A8, 0xFFBFE3B4];
const CATS = ["Hortifrúti", "Laticínios e ovos", "Carnes", "Padaria", "Mercearia", "Limpeza"];
const WORDS = {
  "Hortifrúti": ["tomate","cebola","alho","banana","maçã","limão","batata","cogumelo","alface","cenoura","pimentão","salsinha","alecrim","fruta","abacate"],
  "Laticínios e ovos": ["leite","queijo","parmesão","manteiga","iogurte","creme","requeijão","ovo"],
  "Carnes": ["frango","carne","peixe","linguiça","bacon","presunto","sobrecoxa"],
  "Padaria": ["pão","bolo","torrada","bisnaga"],
  "Limpeza": ["detergente","sabão","esponja","papel","amaciante","desinfetante","saco de lixo"],
};
const guess = n => { n = n.toLowerCase(); for (const k in WORDS) if (WORDS[k].some(w => n.includes(w))) return k; return "Mercearia"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// The pairing QR carries the code in the URL fragment, which browsers never send to any server.
const fromHash = new URLSearchParams(location.hash.slice(1)).get("casa");
if (fromHash) { store.set("casa", fromHash); history.replaceState(null, "", location.pathname + location.search); }
const CODE = store.get("casa", null);
// Scanning the QR while this page is already open only changes the fragment: pick it up then too.
addEventListener("hashchange", () => {
  const c = new URLSearchParams(location.hash.slice(1)).get("casa");
  if (c) { store.set("casa", c); location.replace(location.pathname + location.search); }
});

const S = {
  tab: store.get("tab", "list"),
  rows: Object.assign({ shopping_items: {}, notes: {}, reminders: {}, recipes: {}, receipts: {}, dinners: {}, photos: {} }, store.get("rows", {})),  // by id, tombstones included
  view: null,  // recipes tab: null (list) | { mode: "view" | "edit", id }
  outbox: store.get("outbox", {}),
  cursor: store.get("cursor", "1970-01-01T00:00:00Z"),
};
const save = () => { store.set("rows", S.rows); store.set("outbox", S.outbox); store.set("cursor", S.cursor); };

async function rpc(fn, args) {
  const headers = { "Content-Type": "application/json", apikey: SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL.replace(/\/$/, "")}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(args) });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function setStatus(kind, text) {
  document.getElementById("dot").className = "dot " + (kind === "ok" ? "ok" : kind === "off" ? "off" : "");
  document.getElementById("status").textContent = text;
}

function change(table, row) {
  row.updated_at = new Date().toISOString();
  S.rows[table][row.id] = row;
  S.outbox[table + "/" + row.id] = { table, row };
  save(); render(); clearTimeout(change.t); change.t = setTimeout(sync, 600);
}

let syncing = false;
async function sync() {
  if (!CODE || !SUPABASE_URL || syncing) return;
  syncing = true;
  try {
    const sent = { ...S.outbox };
    const keys = Object.keys(sent);
    if (keys.length) {
      const p_rows = { shopping_items: [], notes: [], reminders: [], recipes: [], receipts: [], dinners: [], photos: [] };
      keys.forEach(k => p_rows[sent[k].table].push(sent[k].row));
      await rpc("kitchen_push", { p_code: CODE, p_rows, p_create: false });
      keys.forEach(k => { if (S.outbox[k] === sent[k]) delete S.outbox[k]; });
    }
    const since = new Date(new Date(S.cursor).getTime() - 10000).toISOString();
    const r = await rpc("kitchen_pull", { p_code: CODE, p_since: since });
    let changed = false;
    for (const table of ["shopping_items", "notes", "reminders", "recipes", "receipts", "dinners", "photos"]) {
      for (const row of r[table] || []) {
        const local = S.rows[table][row.id];
        const pending = S.outbox[table + "/" + row.id];
        if (pending && new Date(pending.row.updated_at) >= new Date(row.updated_at)) continue;
        // Photos: the phone keeps only the thumbnail (the big one would fill the browser's storage).
        if (table === "photos") delete row.image;
        if (!local || new Date(row.updated_at) > new Date(local.updated_at)) { S.rows[table][row.id] = row; changed = true; }
      }
    }
    S.cursor = r.cursor;
    // Never redraw under someone typing a recipe: they would lose what they wrote.
    save(); if (changed && S.view?.mode !== "edit") render();
    setStatus("ok", "Sincronizado com o painel");
  } catch (e) {
    setStatus("off", String(e.message).includes("casa não encontrada") ? "Código da casa inválido" : "Sem conexão");
  } finally { syncing = false; }
}

const live = table => Object.values(S.rows[table]).filter(r => !r.deleted);
const check = '<span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';

// ---------- Quem janta hoje ----------
// One answer per person per day; the panel counts them and sets the recipes' portions.

const today = () => new Date().toLocaleDateString("sv-SE");  // YYYY-MM-DD in the phone's time zone

function dinnerToday() {
  const day = today(), latest = {};
  for (const r of live("dinners")) {
    if (r.day !== day || !r.person) continue;
    const k = r.person.toLowerCase();
    if (!latest[k] || new Date(r.updated_at) > new Date(latest[k].updated_at)) latest[k] = r;
  }
  return latest;
}

function dinnerCard() {
  const me = store.get("nome", "");
  if (!me) return "";
  const all = dinnerToday(), mine = all[me.toLowerCase()];
  const others = Object.values(all).filter(r => r.person.toLowerCase() !== me.toLowerCase())
    .sort((a, b) => a.person.localeCompare(b.person, "pt-BR"));
  const n = Object.values(all).filter(r => r.coming).length;
  return `<div class="label">Jantar de hoje</div><div class="card dinner">
    <div class="btns"><button data-dinner="1" class="${mine?.coming === true ? "yes" : ""}">Vou jantar</button>
      <button data-dinner="0" class="${mine?.coming === false ? "no" : ""}">Não vou</button></div>
    <p>${n ? `${n} ${n === 1 ? "pessoa vai" : "pessoas vão"} jantar` : "Ninguém confirmou ainda"}${others.length
      ? " · " + others.map(r => `${esc(r.person)} ${r.coming ? "vai" : "não vai"}`).join(", ") : ""}</p></div>`;
}

function answerDinner(coming) {
  const me = store.get("nome", "");
  if (!me) return;
  const mine = dinnerToday()[me.toLowerCase()];
  change("dinners", mine ? { ...mine, coming } : { id: uuid(), day: today(), person: me, coming, deleted: false });
}

// ---------- Fotos no painel ----------
// They pass slowly in the panel's ambient mode. The panel gets the 1280 px photo; phones keep
// only a small thumbnail.

function photosSection() {
  const list = live("photos").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  return `<div class="label">Fotos no painel</div>
    ${list.length ? `<div class="photos">${list.map(p => `<div class="ph">${p.thumb ? `<img src="${esc(p.thumb)}" alt="">` : ""}
      <button data-del-photo="${p.id}" aria-label="Apagar foto">×</button>${p.author ? `<small>${esc(p.author)}</small>` : ""}</div>`).join("")}</div>`
      : `<div class="empty">As fotos enviadas aqui passam no painel quando ele está em descanso.</div>`}
    <label class="photo-add" id="photoAddLabel">Enviar fotos<input type="file" accept="image/*" multiple id="familyPhotos"></label>
    <div class="err-text" id="familyPhotoErr"></div>`;
}

async function addFamilyPhotos(files) {
  const err = document.getElementById("familyPhotoErr"), label = document.getElementById("photoAddLabel");
  let sent = 0;
  for (const f of files) {
    if (label) label.firstChild.textContent = `Preparando ${sent + 1} de ${files.length}…`;
    try {
      const image = await shrinkPhoto(f, 1280, 700000, 0.82);
      const thumb = await shrinkPhoto(f, 240, 50000, 0.7);
      const row = { id: uuid(), image, thumb, caption: "", author: store.get("nome", ""), deleted: false, updated_at: new Date().toISOString() };
      S.outbox["photos/" + row.id] = { table: "photos", row };
      const { image: _, ...small } = row;
      S.rows.photos[row.id] = small;
      sent++;
    } catch { if (err) err.textContent = "Não foi possível abrir uma das fotos."; }
  }
  save(); render(); sync();
}

// ---------- Cupom fiscal ----------
// The phone's camera focuses on the small QR; the panel then queries SEFAZ-PB (browsers can't).

const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const nfceKey = s => { try { s = decodeURIComponent(s); } catch {} const m = String(s).replace(/[\s.\-]/g, "").match(/\d{44}/); return m ? m[0] : null; };
const isNfce = s => /sefaz|nfce|fazenda/i.test(s) && !!nfceKey(s);

function cupomCard() {
  const all = Object.values(S.rows.receipts || {}).filter(r => !r.deleted);
  const now = new Date();
  const month = all.filter(r => r.import_status !== "pending" && r.import_status !== "failed" && r.purchased_at &&
    new Date(r.purchased_at).getMonth() === now.getMonth() && new Date(r.purchased_at).getFullYear() === now.getFullYear());
  const recent = all.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)).slice(0, 4);
  const monthName = now.toLocaleDateString("pt-BR", { month: "long" });
  return `<div class="cupom">
    <div class="head"><b>Cupom fiscal</b>${month.length ? `<span class="month">${monthName}: ${brl(month.reduce((t, r) => t + Number(r.total || 0), 0))}</span>` : ""}</div>
    <button class="scan" data-scan-cupom>Ler cupom fiscal</button>
    <div class="or">Aponte para o QR code do rodapé do cupom. Ou cole o link que a câmera do celular abriu:</div>
    <form class="add" id="cupomLink" novalidate><input id="cupomUrl" type="url" inputmode="url" placeholder="https://www.sefaz.pb.gov.br/nfce?p=…" autocomplete="off" aria-label="Link do cupom"><button aria-label="Enviar cupom">↓</button></form>
    <div class="err-text" id="cupomErr"></div>
    ${recent.map(r => r.import_status === "pending"
      ? `<div class="rec"><b><span class="spin"></span>Cupom enviado</b><span>o painel está consultando a SEFAZ…</span></div>`
      : r.import_status === "failed"
        ? `<div class="rec fail"><b>Não deu para ler</b><span>${esc(r.import_error || "")}</span><button data-retry-cupom="${r.id}">Tentar de novo</button></div>`
        : `<div class="rec"><b>${esc(r.store)}</b><span>${new Date(r.purchased_at).toLocaleDateString("pt-BR")} · ${brl(r.total)}</span></div>`).join("")}
  </div>`;
}

/** Queues a note for the panel to read. Returns false when the text is not a cupom link. */
function requestReceipt(raw) {
  const text = String(raw || "").trim();
  if (!isNfce(text)) return false;
  const key = nfceKey(text);
  const known = Object.values(S.rows.receipts || {}).find(r => !r.deleted && r.access_key === key && r.import_status !== "failed");
  if (known) { cupomMessage(known.import_status === "pending" ? "Esse cupom já está sendo lido pelo painel." : "Esse cupom já foi registrado."); return true; }
  const url = (text.match(/https?:\/\/\S+/) || [text])[0];
  change("receipts", { id: uuid(), access_key: key, qr: url, import_status: "pending", import_error: null,
    store: "", store_legal_name: "", purchased_at: null, total: 0, discount: 0, items: [], deleted: false });
  S.tab = "list"; store.set("tab", "list"); render();
  return true;
}

function cupomMessage(msg) { const e = document.getElementById("cupomErr"); if (e) e.textContent = msg; }

// QR decoding: ZXing (C++ compiled to WebAssembly) copes with blur and curved paper much better
// than jsQR; jsQR stays as a fallback if the WebAssembly file cannot be loaded.
let zxingReady = null, jsQRReady = null;
function loadScript(src) {
  return new Promise((ok, fail) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
}
function loadZXing() {
  return zxingReady ||= loadScript("https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.3/dist/iife/reader/index.js")
    .then(() => window.ZXingWASM).catch(e => { zxingReady = null; throw e; });
}
function loadJsQR() {
  return jsQRReady ||= loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js")
    .then(() => window.jsQR).catch(e => { jsQRReady = null; throw e; });
}
const QR_OPTIONS = { formats: ["QRCode"], tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 1 };

/** Text of the first QR in an ImageData, or null. */
async function decodeImageData(data) {
  try {
    const zx = await loadZXing();
    const res = await zx.readBarcodes(data, QR_OPTIONS);
    const hit = res.find(r => r.isValid && r.text);
    if (hit) return hit.text;
  } catch {
    const jsQR = await loadJsQR();
    const found = jsQR(data.data, data.width, data.height, { inversionAttempts: "dontInvert" });
    if (found?.data) return found.data;
  }
  return null;
}

/** Draws [src] (video or image), optionally cropped to the centre square, at most [max] px. */
function frameData(src, w, h, crop, max) {
  const side = crop ? Math.min(w, h) * 0.8 : null;
  const sx = crop ? (w - side) / 2 : 0, sy = crop ? (h - side) / 2 : 0, sw = crop ? side : w, sh = crop ? side : h;
  const scale = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement("canvas");
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return ctx.getImageData(0, 0, c.width, c.height);
}

/** Finds the QR in a still photo: whole picture first, then the centre at a few sizes. */
async function readQrPhoto(file) {
  const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = URL.createObjectURL(file); });
  try {
    for (const [crop, max] of [[false, 2000], [true, 1400], [true, 900], [false, 1200]]) {
      const text = await decodeImageData(frameData(img, img.naturalWidth, img.naturalHeight, crop, max));
      if (text) return text;
    }
    return null;
  } finally { URL.revokeObjectURL(img.src); }
}

/** Live camera inside the page: tries ~5 times a second until a cupom QR is read. */
async function openCupomScanner() {
  const box = document.createElement("div");
  box.className = "scanner";
  box.innerHTML = `<video playsinline muted autoplay></video>
    <div class="mask"><div class="frame"></div></div>
    <div class="msg">Preparando a câmera…</div>
    <div class="bar"><button data-close>Cancelar</button><button data-torch hidden>Lanterna</button>
      <label>Usar uma foto<input type="file" accept="image/*" data-photo></label></div>`;
  document.body.appendChild(box);
  const video = box.querySelector("video"), msg = box.querySelector(".msg");
  let stream = null, stop = false, torch = false;
  const close = () => { stop = true; stream?.getTracks().forEach(t => t.stop()); box.remove(); };
  const done = text => {
    if (requestReceipt(text)) { close(); return true; }
    msg.textContent = "Esse QR code não é de um cupom fiscal. Aponte para o QR do rodapé do cupom.";
    return false;
  };
  box.querySelector("[data-close]").onclick = close;
  box.querySelector("[data-photo]").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    msg.textContent = "Procurando o QR code na foto…";
    const text = await readQrPhoto(f).catch(() => null);
    if (!text) msg.textContent = "Não achei o QR code nesta foto. Tente de novo mais perto e com luz.";
    else done(text);
  };
  loadZXing().catch(() => loadJsQR());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] },
    });
  } catch {
    msg.textContent = "A câmera não abriu. Permita a câmera para este site, ou use uma foto.";
    return;
  }
  if (stop) return stream.getTracks().forEach(t => t.stop());
  video.srcObject = stream;
  await video.play().catch(() => {});
  const track = stream.getVideoTracks()[0];
  if (track.getCapabilities?.().torch) {
    const b = box.querySelector("[data-torch]"); b.hidden = false;
    b.onclick = () => { torch = !torch; track.applyConstraints({ advanced: [{ torch }] }).catch(() => {}); b.textContent = torch ? "Apagar luz" : "Lanterna"; };
  }
  msg.textContent = "Aproxime o QR code do cupom até ele preencher o quadrado";
  let n = 0;
  while (!stop) {
    if (video.videoWidth) {
      // Alternate: the guide square at full detail, and the whole frame in case the QR is elsewhere.
      const crop = n++ % 3 !== 2;
      const text = await decodeImageData(frameData(video, video.videoWidth, video.videoHeight, crop, crop ? 1000 : 1280)).catch(() => null);
      if (text && done(text)) return;
    }
    await new Promise(r => setTimeout(r, 180));
  }
}

function openRecipes(view) { S.view = view; S.photo = undefined; render(); scrollTo(0, 0); }

// Photo being edited: undefined = keep the saved one, null = removed, string = new data URL.
function formPhoto() {
  if (S.photo !== undefined) return S.photo;
  return S.view?.id ? S.rows.recipes[S.view.id]?.image || null : null;
}

/** Shrinks a photo on the phone (recipes: 800 px, ~60-100 KB) before it is stored. */
function shrinkPhoto(file, max = 800, limit = 550000, q0 = 0.78) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      let q = q0, out = c.toDataURL("image/jpeg", q);
      while (out.length > limit && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > limit ? reject(new Error("grande")) : resolve(out);
    };
    img.onerror = () => reject(new Error("formato"));
    img.src = URL.createObjectURL(file);
  });
}

/** Re-render the form without losing what was typed. */
function keepForm(fn) {
  const ids = ["rTitle", "rMinutes", "rServings", "rAuthor", "rIngredients", "rSteps"];
  const vals = Object.fromEntries(ids.map(id => [id, document.getElementById(id)?.value]));
  fn(); render();
  ids.forEach(id => { const el = document.getElementById(id); if (el && vals[id] != null) el.value = vals[id]; });
}

function statusChip(r) {
  if (r.import_status === "pending") return `<span class="status-chip wait">importando</span>`;
  if (r.import_status === "failed") return `<span class="status-chip fail">não importada</span>`;
  return "";
}
function recipeMeta(r) {
  if (r.import_status === "pending") return "O painel está buscando a receita…";
  if (r.import_status === "failed") return esc(r.import_error || "Não foi possível importar");
  return `${r.minutes} min · ${r.servings} porções · ${r.source_name ? "do " + esc(r.source_name) : "de " + esc(r.author)}`;
}

/** A link pasted or shared from another app; the panel does the fetching (browsers block it here). */
function requestImport(raw) {
  if (requestReceipt(raw)) return true;
  const m = String(raw || "").match(/https?:\/\/[^\s"'<>]+/);
  if (!m) return false;
  const url = m[0].replace(/[).,;]+$/, "");
  const existing = live("recipes").find(r => r.source_url === url);
  if (existing) { S.tab = "recipes"; openRecipes({ mode: "view", id: existing.id }); return true; }
  const host = new URL(url).hostname.replace(/^www\./, "");
  change("recipes", { id: uuid(), title: host, minutes: 30, servings: 4, author: host, ingredients: [], steps: [],
    source_url: url, source_name: null, import_status: "pending", import_error: null, deleted: false });
  S.tab = "recipes"; store.set("tab", "recipes"); openRecipes(null);
  return true;
}

function saveRecipe() {
  const val = id => document.getElementById(id).value;
  const lines = id => val(id).split("\n").map(l => l.trim()).filter(Boolean);
  const title = val("rTitle").trim(), ingredients = lines("rIngredients"), steps = lines("rSteps");
  const err = document.getElementById("recipeErr");
  if (!title) { document.getElementById("rTitle").classList.add("err"); err.textContent = "Dê um nome para a receita"; return; }
  if (!ingredients.length && !steps.length) { err.textContent = "Escreva os ingredientes ou o modo de preparo"; return; }
  const author = val("rAuthor").trim() || "Família";
  const id = S.view?.id || uuid();
  const before = S.view?.id ? S.rows.recipes[S.view.id] : {};
  change("recipes", {
    ...before, id, title, author, ingredients, steps, deleted: false, image: formPhoto(),
    minutes: Math.max(1, parseInt(val("rMinutes"), 10) || 30),
    servings: Math.max(1, parseInt(val("rServings"), 10) || 4),
  });
  openRecipes({ mode: "view", id });
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; S.view = null; store.set("tab", S.tab); render(); return; }
  if (e.target.closest("[data-scan-cupom]")) { cupomMessage(""); openCupomScanner(); return; }
  if (e.target.closest("[data-new-recipe]")) return openRecipes({ mode: "edit", id: null });
  const dp = e.target.closest("[data-del-photo]");
  if (dp) {
    const p = S.rows.photos[dp.dataset.delPhoto];
    if (p && confirm("Apagar esta foto do painel?")) change("photos", { ...p, thumb: null, deleted: true });
    return;
  }
  const dn = e.target.closest("[data-dinner]");
  if (dn) { answerDinner(dn.dataset.dinner === "1"); return; }
  if (e.target.closest("[data-change-name]")) { store.set("nome", ""); render(); document.getElementById("whoName")?.focus(); return; }
  if (e.target.closest("[data-remove-photo]")) return keepForm(() => { S.photo = null; });
  const retryCupom = e.target.closest("[data-retry-cupom]");
  if (retryCupom) { const r = S.rows.receipts[retryCupom.dataset.retryCupom]; change("receipts", { ...r, import_status: "pending", import_error: null }); return; }
  const retry = e.target.closest("[data-retry-import]");
  if (retry) { const r = S.rows.recipes[retry.dataset.retryImport]; change("recipes", { ...r, import_status: "pending", import_error: null }); return openRecipes({ mode: "view", id: r.id }); }
  if (e.target.closest("[data-recipes-back]")) return openRecipes(S.view?.mode === "edit" && S.view.id ? { mode: "view", id: S.view.id } : null);
  const rc = e.target.closest("[data-recipe]");
  if (rc) return openRecipes({ mode: "view", id: rc.dataset.recipe });
  const ed = e.target.closest("[data-edit-recipe]");
  if (ed) return openRecipes({ mode: "edit", id: ed.dataset.editRecipe });
  const del = e.target.closest("[data-delete-recipe]");
  if (del) {
    if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "Toque de novo para apagar"; return; }
    change("recipes", { ...S.rows.recipes[del.dataset.deleteRecipe], deleted: true });
    return openRecipes(null);
  }
  const item = e.target.closest("[data-item]");
  if (item) { const r = S.rows.shopping_items[item.dataset.item]; change("shopping_items", { ...r, done: !r.done }); return; }
  const rem = e.target.closest("[data-rem]");
  if (rem) { const r = S.rows.reminders[rem.dataset.rem]; change("reminders", { ...r, done: !r.done }); return; }
  if (e.target.id === "clear") live("shopping_items").filter(i => i.done).forEach(i => change("shopping_items", { ...i, deleted: true }));
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "recipeForm") return saveRecipe();
  if (e.target.id === "whoForm") {
    const input = document.getElementById("whoName"), name = input.value.trim();
    if (!name) { input.classList.add("err"); return; }
    store.set("nome", name.charAt(0).toUpperCase() + name.slice(1).slice(0, 29)); render(); return;
  }
  if (e.target.id === "cupomLink") {
    const input = document.getElementById("cupomUrl");
    if (!requestReceipt(input.value)) { input.classList.add("err"); cupomMessage("Cole o link do QR code do cupom (sefaz.pb.gov.br/nfce…)"); }
    return;
  }
  if (e.target.id === "importForm") {
    const input = document.getElementById("importUrl");
    if (!requestImport(input.value)) { input.classList.add("err"); document.getElementById("importErr").textContent = "Cole um link que comece com https://"; }
    return;
  }
  if (e.target.id === "addItem") {
    const input = document.getElementById("itemName"), name = input.value.trim();
    if (!name) { input.classList.add("err"); document.getElementById("itemErr").textContent = "Digite o nome do item"; return; }
    const nice = name.charAt(0).toUpperCase() + name.slice(1);
    if (live("shopping_items").some(i => !i.done && i.name.toLowerCase() === nice.toLowerCase())) { input.value = ""; return; }
    change("shopping_items", { id: uuid(), name: nice, category: guess(nice), done: false, deleted: false });
    document.getElementById("itemName").focus();
  }
  if (e.target.id === "addNote") {
    const input = document.getElementById("noteText"), body = input.value.trim();
    if (!body) { input.classList.add("err"); document.getElementById("noteErr").textContent = "Escreva o recado"; return; }
    const who = store.get("nome", "") || "Celular";
    change("notes", { id: uuid(), body, author: who, color: COLORS[live("notes").length % COLORS.length], tilt: +(Math.random() * 3 - 1.5).toFixed(1), deleted: false });
  }
});
document.addEventListener("change", async e => {
  if (e.target.id === "familyPhotos" && e.target.files?.length) return addFamilyPhotos([...e.target.files]);
  if (e.target.id !== "rPhoto" || !e.target.files?.[0]) return;
  try {
    const data = await shrinkPhoto(e.target.files[0]);
    keepForm(() => { S.photo = data; });
  } catch (err) {
    document.getElementById("photoErr").textContent = err.message === "grande" ? "Essa foto ficou grande demais. Tente outra." : "Não foi possível abrir essa imagem.";
  }
});
document.addEventListener("input", e => {
  e.target.classList.remove("err");
  const t = e.target.closest("form")?.nextElementSibling;
  if (t?.classList.contains("err-text")) t.textContent = "";
  const re = document.getElementById("recipeErr"); if (re) re.textContent = "";
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });

// Android "Compartilhar → Cozinha" opens ?share&url=…&text=… (see manifest.webmanifest).
const shared = new URLSearchParams(location.search);
if (shared.has("share")) {
  history.replaceState(null, "", location.pathname);
  if (CODE) requestImport(shared.get("url") || shared.get("text") || "");
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

render();
sync();
setInterval(() => { if (!document.hidden) sync(); }, 8000);
</script>
</body>
</html>
