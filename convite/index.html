<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<meta name="robots" content="noindex">
<title>Convite · Meus Centavos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060708;--card:#101416;--line:#232b2e;--fg:#eef0ea;--mute:#8d9591;--dim:#596160;
  --mint:#7fe0b0;--mint-ink:#06301f;--alert:#ff6f5e;
  --display:'Big Shoulders Display','Arial Narrow',sans-serif;--body:'Onest',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 40px) 22px calc(env(safe-area-inset-bottom) + 32px);max-width:480px;margin:0 auto}
.rise{opacity:0;transform:translateY(14px);animation:rise .6s var(--ease) forwards}
.rise:nth-child(2){animation-delay:.08s}.rise:nth-child(3){animation-delay:.16s}.rise:nth-child(4){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:300;font-size:64px;line-height:1;color:var(--mint)}
p{color:var(--mute);font-size:17px;line-height:1.45;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:28px;text-align:center}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.code{font-family:var(--display);font-weight:300;font-size:64px;letter-spacing:6px;color:var(--mint);margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:18px;background:var(--mint);
  color:var(--mint-ink);font:500 17px var(--body);text-decoration:none;margin-top:22px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.steps{color:var(--mute);font-size:15px;line-height:1.5;margin-top:18px;text-align:left}
.steps b{color:var(--fg);font-weight:500}
.error{color:var(--alert)}
</style>
</head>
<body>
  <h1 class="rise">Meus Centavos</h1>
  <p class="rise" id="lead">Você foi convidado para entrar numa família.</p>
  <div class="card rise" id="card">
    <div class="label">Código do convite</div>
    <div class="code" id="code">——————</div>
    <a class="btn" id="open" href="#">Abrir no app</a>
  </div>
  <div class="steps rise">
    Se o app não abrir: instale o <b>Meus Centavos</b>, entre com a sua conta, toque em
    <b>Tenho um convite</b> e digite o código. O convite vale 48 horas.
  </div>
<script>
// The code travels in the URL fragment (#123456), which the browser never sends to a server.
const code = (location.hash.match(/\d{6}/) || [])[0];
if (code) {
  document.getElementById('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
  const appLink = 'meuscentavos://invite/' + code;
  document.getElementById('open').href = appLink;
  // Try once on arrival; the button stays for when the browser asks first.
  setTimeout(() => { location.href = appLink; }, 400);
} else {
  document.getElementById('lead').textContent = 'Esse link de convite está incompleto.';
  document.getElementById('lead').classList.add('error');
  document.getElementById('card').style.display = 'none';
}
</script>
</body>
</html>
